# ==============================================================================
# Emergency Evacuation Route Simulation and Risk Analysis
# Application Configuration
# ==============================================================================

server.port=8080
spring.application.name=Emergency Evacuation Route Simulation

# ------------------------------------------------------------------------------
# Primary MySQL Database Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/evacuation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Do not run raw schema.sql automatically at boot (Hibernate and DataInitializer manage tables)
spring.sql.init.mode=never

# ------------------------------------------------------------------------------
# Static Resources & Web Configuration
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.root=INFO
logging.level.com.evacuation=INFO
logging.level.org.springframework.web=INFO
